<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>
</head>
<body style="font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
             background: linear-gradient(135deg, #e0f7fa, #f1f8e9); 
             margin:0; padding:0; color:#333;">

    <h2 style="text-align:center; color:#0d47a1; margin-top:50px; 
               font-size:32px; text-shadow: 1px 1px 5px rgba(0,0,0,0.1);">
        Upload Your Resume
    </h2>

    <form method="post" enctype="multipart/form-data" 
          style="max-width:700px; margin:50px auto; padding:40px; 
                 background: linear-gradient(145deg, #ffffff, #f0f0f0); 
                 box-shadow: 0 15px 35px rgba(0,0,0,0.15); 
                 border-radius:20px; display:flex; flex-direction:column; gap:25px;
                 transition: all 0.3s ease-in-out;">

        <label style="font-weight:700; margin-bottom:5px; font-size:18px; color:#0d47a1;">
            Resume (PDF/DOCX/TXT):
        </label>
        <input type="file" name="resume" required 
               style="padding:15px; border-radius:12px; border:1px solid #ccc; 
                      font-size:16px; width:100%; box-sizing:border-box; 
                      transition: all 0.3s ease-in-out;"
               onfocus="this.style.borderColor='#0d47a1';" 
               onblur="this.style.borderColor='#ccc';">

        <label style="font-weight:700; margin-bottom:5px; font-size:18px; color:#0d47a1;">
            Job Description:
        </label>
        <textarea name="job_description" rows="5" cols="50" required 
                  style="padding:15px; border-radius:12px; border:1px solid #ccc; 
                         font-size:16px; width:100%; box-sizing:border-box; 
                         transition: all 0.3s ease-in-out;"
                  onfocus="this.style.borderColor='#0d47a1';" 
                  onblur="this.style.borderColor='#ccc';"></textarea>

        <input type="submit" value="Analyze" 
               style="background-color:#0d47a1; color:white; padding:16px; border:none; 
                      border-radius:12px; cursor:pointer; font-size:20px; font-weight:700; 
                      box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: all 0.3s ease-in-out;"
               onmouseover="this.style.backgroundColor='#08306b'; this.style.transform='scale(1.05)';"
               onmouseout="this.style.backgroundColor='#0d47a1'; this.style.transform='scale(1)';">
    </form>

</body>
</html>
